<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Что в блюде?</title>
<link rel="stylesheet" href="common.css?v=4">
<style>
  .dish { left: 34px; top: 116px; width: 840px; height: 420px; --back: #e6c27a; }
  .dish h2 { position: absolute; left: 24px; top: 14px; margin: 0; font-size: 36px; }
  .dish img.main { position: absolute; left: 50%; top: 54%; transform: translate(-50%, -50%); max-width: 440px; max-height: 320px; filter: drop-shadow(8px 12px 8px rgba(60,40,10,.28)); }
  .dish .side { position: absolute; right: 22px; bottom: 22px; width: 190px; height: 190px; border-radius: 50%; border: 5px dashed rgba(60,40,10,.25); display: none; }
  .dish .side.on { display: block; }
  .dish .side.hot { border-color: var(--veg); background: rgba(79,143,79,.12); }
  .dish .side .lbl { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); white-space: nowrap; font-family: Balsamiq; font-size: 20px; }
  .dish .parts { position: absolute; left: 24px; top: 64px; display: flex; flex-direction: column; gap: 6px; }
  .dish .parts span { font-size: 21px; font-weight: 800; background: var(--paper); padding: 4px 12px; border-radius: 10px; box-shadow: var(--shadow); border-left: 8px solid var(--c); animation: pop .3s cubic-bezier(.3,1.8,.6,1) backwards; }
  .ask { left: 910px; top: 116px; width: 656px; height: 420px; padding: 18px 24px; --back: #9cc9b4; }
  .ask h3 { margin: 0 0 8px; font-size: 28px; }
  .say { bottom: 274px; }
  .chip small { display: block; font-family: Nunito; font-weight: 800; font-size: 16px; opacity: .7; margin-top: 2px; }
  .chip { display: flex; align-items: center; gap: 14px; width: 100%; margin: 8px 0; padding: 8px 16px; border-radius: 16px; border: 5px solid var(--c); background: var(--paper); cursor: pointer; font-family: Balsamiq; font-size: 28px; color: var(--ink); text-align: left; transition: transform .1s; }
  .chip img { height: 46px; }
  .chip .mark { margin-left: auto; width: 40px; height: 40px; border-radius: 10px; border: 4px solid var(--c); display: grid; place-items: center; font-size: 28px; color: var(--paper); }
  .chip.on .mark { background: var(--c); }
  .chip.on .mark::after { content: "✓"; }
  .chip.right { box-shadow: 0 0 0 6px rgba(79,143,79,.5); }
  .chip.miss { box-shadow: 0 0 0 6px rgba(201,96,63,.55); animation: shake .45s; }
  .chip:disabled { cursor: default; }
  .chip.miss .mark { border-color: var(--prot); color: var(--prot); }
  .chip.miss:not(.on) .mark::after { content: "!"; }
  .chip.miss.on .mark { background: var(--prot); }
  #check { width: 100%; margin-top: 8px; font-size: 28px; }
  .shelf.dim .item { opacity: .35; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="top">
    <a class="btn ghost" href="index.html">← Меню</a>
    <div class="card task"><div class="num">?</div><div id="task">Какие друзья <b>спрятались в блюде</b>? Отметь и нажми «Проверить».</div></div>
    <button class="btn ghost guideBtn" id="gBtn">Кто есть кто?</button>
    <div class="round" id="round">Блюдо 1 из 8</div>
  </div>
  <div class="card dish"><h2 id="dname"></h2><img class="main" id="dimg"><div class="parts" id="parts"></div><div class="side" id="side"><div class="lbl">добавь сюда</div></div></div>
  <div class="card ask">
    <h3>Кто здесь есть?</h3>
    <button class="chip" data-f="0" style="--c:var(--veg)"><img src="../video/sprites/pfood-1.png"><div>Овощи и фрукты<small>огурец, морковь, яблоко, ягоды…</small></div><span class="mark"></span></button>
    <button class="chip" data-f="1" style="--c:var(--grain)"><img src="../video/sprites/pfood-3.png"><div>Крупы и хлеб<small>рис, гречка, макароны, картошка, хлеб…</small></div><span class="mark"></span></button>
    <button class="chip" data-f="2" style="--c:var(--prot)"><img src="../video/sprites/pfood-4.png"><div>Белок<small>яйцо, творог, мясо, рыба, фасоль…</small></div><span class="mark"></span></button>
    <button class="btn green" id="check">Проверить</button>
  </div>
  <div class="say"><div class="face"></div><div class="txt"></div></div>
  <div class="shelf dim" id="shelf"><div class="lbl">добавки</div></div>
  <div class="win"><div class="card" style="--back:#e6c27a"></div></div>
</div>
<script src="common.js?v=3"></script>
<script>
// parts: [что, друг]; soft: [друг, пояснение] — спорная часть, засчитываем любой ответ и объясняем
const DISHES = [
  { name: "Плов", img: "el60-8", parts: [["рис", 1], ["мясо", 2], ["морковь", 0]] },
  { name: "Гречка с сосиской", img: "el60-2", parts: [["гречка", 1], ["сосиска", 2]] },
  { name: "Сырники с ягодами", img: "menuB-1", parts: [["творог", 2], ["мука", 1], ["ягоды", 0]] },
  { name: "Рыба с картошкой", img: "el10-8", parts: [["рыба", 2], ["картошка", 1], ["брокколи и морковь", 0]],
    soft: [0, "Картошку мы считаем гарниром, как кашу. А овощи здесь — брокколи и морковь."] },
  { name: "Овощной суп с лапшой", img: "el60-9", parts: [["лапша", 1], ["морковь и зелень", 0]] },
  { name: "Блинчики", img: "el60-6", parts: [["мука", 1]],
    soft: [2, "В тесте есть яйцо и молоко, но белка там совсем немного. Лучше добавить творог или сыр."] },
  { name: "Фасоль с овощами", img: "menuL-9", parts: [["фасоль", 2], ["перец, кукуруза, томаты", 0], ["сыр сверху", 2]] },
  { name: "Обед в школе", img: "el10-7", parts: [["рис", 1], ["курица", 2], ["брокколи и морковь", 0]] },
];
const ADDONS = [
  { img: "pfood-1", name: "огурец", team: 0 }, { img: "el20-5", name: "помидор", team: 0 }, { img: "pfood-10", name: "морковь", team: 0 },
  { img: "pfood-9", name: "брокколи", team: 0 }, { img: "pfood-2", name: "яблоко", team: 0 }, { img: "el20-1", name: "банан", team: 0 },
  { img: "pfood-3", name: "хлеб", team: 1 }, { img: "pfood-6", name: "гречка", team: 1 }, { img: "pfood-8", name: "картошка", team: 1 },
  { img: "pfood-4", name: "яйцо", team: 2 }, { img: "pfood-5", name: "творог", team: 2 }, { img: "el20-10", name: "сыр", team: 2 },
];
const NAMES = ["Овощи и фрукты", "Крупы и хлеб", "Белок"];
let D = 0, st, score = 0;
const chips = [...document.querySelectorAll(".chip")];
chips.forEach(c => c.onclick = () => { if (st.checked) return; audio(); sfx.pick(); c.classList.toggle("on"); });

function start(d) {
  D = d; const ds = DISHES[d];
  st = { checked: false, need: [], added: 0 };
  hideWin(); stage.querySelectorAll(".item").forEach(e => e.remove());
  $("#round").textContent = `Блюдо ${d + 1} из ${DISHES.length}`;
  $("#dname").textContent = ds.name; $("#dimg").src = S(ds.img); $("#parts").innerHTML = "";
  $("#side").classList.remove("on"); $("#shelf").classList.add("dim");
  chips.forEach(c => { c.className = "chip"; c.disabled = false; });
  $("#check").disabled = false; $("#check").textContent = "Проверить";
  $("#task").innerHTML = "Какие друзья <b>спрятались в блюде</b>? Отметь и нажми «Проверить».";
  fillShelf(stage, ADDONS, (el, it) => draggable(el, {
    onMove: (el, p) => $("#side").classList.toggle("hot", inSide(p)),
    onDrop: (el, p) => addOn(el, it, p),
  }));
  say(`${ds.name}. Из чего оно сделано?`, "girl");
}
const inSide = p => p.x > 34 + 840 - 22 - 190 && p.x < 34 + 840 - 22 && p.y > 116 + 420 - 212 && p.y < 116 + 420 - 22;
$("#check").onclick = () => {
  if (st.checked) return;
  audio();
  const ds = DISHES[D], has = [0, 1, 2].map(i => ds.parts.some(p => p[1] === i));
  st.checked = true; let allRight = true;
  chips.forEach((c, i) => {
    c.disabled = true;
    const picked = c.classList.contains("on");
    const soft = ds.soft && ds.soft[0] === i;
    if (picked === has[i] || soft) { if (has[i] || (soft && picked)) c.classList.add("right"); }
    else { c.classList.add("miss"); allRight = false; }
  });
  // показываем, из чего блюдо
  $("#parts").innerHTML = ds.parts.map(([n, t], i) => `<span style="--c:${FRIENDS[t].color}; animation-delay:${i * .15}s">${cap(n)} — ${FRIENDS[t].short}</span>`).join("");
  if (allRight) { score++; sfx.check(); } else sfx.nope();
  st.need = [0, 1, 2].filter(i => !has[i]);
  const missTxt = st.need.map(i => `«${NAMES[i]}»`).join(" и ");
  const note = ds.soft ? " " + ds.soft[1] : "";
  if (st.need.length) {
    say(`${allRight ? "Верно!" : "Почти."}${note} Не хватает: ${missTxt}. Добавь с полки на тарелочку!`, "girl", allRight ? "good" : "bad");
    $("#task").innerHTML = `Чего не хватает? <b>Перетащи добавку</b> на тарелочку справа внизу.`;
    $("#side").classList.add("on"); $("#shelf").classList.remove("dim");
  } else {
    say((allRight ? "Верно! Все три друга уже в блюде." : "Смотри: в блюде все три друга — вот они слева.") + note, "girl", allRight ? "good" : "bad");
    next();
  }
};
function addOn(el, it, p) {
  $("#side").classList.remove("hot");
  if (!inSide(p)) return false;
  if (!st.need.includes(it.team)) {
    bounceBack(el);
    say(`${cap(it.name)} — это «${NAMES[it.team]}», а он в блюде уже есть. Кого не хватает?`, "girl", "bad"); return true;
  }
  el.classList.add("back", "placed"); el.dataset.lock = 1;
  el.style.left = (34 + 840 - 22 - 190 - 10 + st.added * 62) + "px"; el.style.top = (116 + 420 - 212 + 46) + "px";
  st.added++; st.need = st.need.filter(t => t !== it.team);
  sfx.plop(); sfx.check();
  if (st.need.length) say(`Да, ${it.name}! А ещё кого не хватает?`, "girl", "good");
  else { say(`Отлично: теперь все три друга на тарелке!`, "girl", "good"); next(); }
  return true;
}
function next() {
  $("#check").disabled = false;
  $("#check").textContent = D < DISHES.length - 1 ? "Следующее блюдо →" : "Готово!";
  $("#check").onclick = () => { $("#check").onclick = checkHandler; if (D < DISHES.length - 1) start(D + 1); else finish(); };
}
const checkHandler = $("#check").onclick;
function finish() {
  sfx.win(); store.set("dishes", true);
  showWin(`<h2>Ты разгадал все блюда!</h2><div class="row">${DISHES.map(d => `<img src="${S(d.img)}">`).join("")}</div>
    <p class="stars">Угадано сразу: ${score} из ${DISHES.length}</p>
    <p>Даже в одном блюде прячутся разные друзья. Если кого‑то нет — его легко добавить рядом: огурец к гречке, яйцо к супу.</p>
    <button class="btn green" onclick="score=0; start(0)">Ещё раз</button> <a class="btn ghost" href="index.html">В меню</a>`);
}
$("#gBtn").onclick = () => friendsGuide();
start(0);
friendsGuide();
</script>
</body>
</html>
