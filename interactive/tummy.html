<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Что говорит живот?</title>
<link rel="stylesheet" href="common.css?v=4">
<style>
  .sit { left: 34px; top: 120px; width: 700px; height: 464px; padding: 22px 26px; --back: #f0b9b0; }
  .sit .when { font-family: Balsamiq; font-size: 26px; color: var(--prot); }
  .sit .txt2 { font-size: 32px; font-weight: 800; line-height: 1.2; margin-top: 8px; max-width: 400px; }
  .sit img.hero2 { position: absolute; right: 18px; bottom: 0; height: 410px; }
  .sit .thought { position: absolute; left: 26px; bottom: 26px; font-family: Balsamiq; font-size: 28px; background: #fffdf4; padding: 12px 20px; border-radius: 22px; box-shadow: var(--shadow); max-width: 380px; }
  .opts { position: absolute; left: 770px; top: 120px; width: 796px; display: flex; flex-direction: column; gap: 16px; }
  .opt { text-align: left; border: 0; cursor: pointer; padding: 20px 26px; border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); font-size: 30px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 16px; transition: transform .1s; }
  .opt:hover { transform: translateX(6px); }
  .opt .l { flex: none; width: 50px; height: 50px; border-radius: 50%; background: var(--cream2); display: grid; place-items: center; font-family: Balsamiq; }
  .opt.ok { box-shadow: 0 0 0 6px rgba(79,143,79,.6), var(--shadow); }
  .opt.ok .l { background: var(--veg); color: var(--paper); }
  .opt.no { box-shadow: 0 0 0 6px rgba(201,96,63,.55), var(--shadow); opacity: .8; }
  .opt.no .l { background: var(--prot); color: var(--paper); }
  .opt:disabled { cursor: default; transform: none; }
  #next { position: absolute; right: 34px; top: 520px; display: none; font-size: 30px; }
  #next.on { display: block; }
</style>
</head>
<body>
<div id="stage">
  <div class="top">
    <a class="btn ghost" href="index.html">← Меню</a>
    <div class="card task" style="--back:#f0b9b0"><div class="num">?</div><div>Что подсказывает живот? <b>Выбери, как лучше поступить.</b></div></div>
    <div class="round" id="round">1 из 6</div>
  </div>
  <div class="card sit"><div class="when" id="when"></div><div class="txt2" id="sit"></div><div class="thought" id="thought"></div><img class="hero2" id="hero"></div>
  <div class="opts" id="opts"></div>
  <button class="btn green" id="next">Дальше →</button>
  <div class="say"><div class="face"></div><div class="txt"></div></div>
  <div class="shelf" style="background:#e9dcbc; box-shadow:none"></div>
  <div class="win"><div class="card" style="--back:#f0b9b0"></div></div>
</div>
<script src="common.js?v=3"></script>
<script>
// ok: true — лучший вариант. Объяснение есть у каждого варианта, без стыда.
const SIT = [
  { when: "Утро", hero: "boy-5", who: "boy", sit: "Скоро в школу. Живот урчит.", th: "«Ррр… я голодный!»", opts: [
    ["Позавтракать: позвать на тарелку трёх друзей", true, "Да! Каша, яйцо и фрукт — сил хватит до обеда."],
    ["Убежать без завтрака", false, "До обеда долго — на уроке будет трудно думать."],
    ["Съесть только печенье", false, "Печенье можно иногда, но одно оно быстро закончится. Добавь трёх друзей."]] },
  { when: "Ужин", hero: "girlact-4", who: "girl", sit: "Девочка съела полтарелки. Больше не хочется.", th: "«Я уже наелась…»", opts: [
    ["Остановиться и сказать «спасибо»", true, "Да! Живот подсказал, что хватит. Доедать необязательно."],
    ["Доесть всё через силу", false, "Доедать через силу не нужно — живот лучше знает."],
    ["Взять ещё добавки", false, "Если уже наелась, добавка не нужна."]] },
  { when: "После футбола", hero: "boyact-3", who: "boy", sit: "Жарко, мальчик набегался.", th: "«Как пить хочется!»", opts: [
    ["Выпить воды", true, "Да! Вода лучше всего утоляет жажду."],
    ["Сладкую газировку", false, "Сладкое — иногда. А когда хочется пить, лучше вода."],
    ["Потерпеть до дома", false, "Не нужно терпеть: пить можно и нужно, когда хочется."]] },
  { when: "После школы", hero: "girlact-1", who: "girl", sit: "До ужина ещё три часа. Живот урчит.", th: "«Можно что‑нибудь перекусить?»", opts: [
    ["Перекус: яблоко и йогурт", true, "Да! Перекус — маленькая тарелка: фрукт и ещё один друг."],
    ["Терпеть до ужина", false, "Если до еды далеко и хочется есть — перекус как раз кстати."],
    ["Съесть целую пачку печенья", false, "Целая пачка — слишком много сладкого. Лучше фрукт и йогурт."]] },
  { when: "Праздник", hero: "boyact-6", who: "boy", sit: "Мальчик уже наелся, а тут несут торт.", th: "«Торт! Но я сытый…»", opts: [
    ["Взять маленький кусочек или отказаться", true, "Да! На празднике можно немного сладкого. А можно и отказаться."],
    ["Съесть большой кусок, раз дают", false, "Если уже сытый, большой кусок не нужен — живот подскажет."],
    ["Торт — это яд, нельзя никогда", false, "Сладкое — не яд. Иногда и понемногу — можно."]] },
  { when: "Обед", hero: "boyact-2", who: "boy", sit: "Мальчик всё съел и всё ещё голоден.", th: "«А можно ещё?»", opts: [
    ["Попросить добавки овощей или гарнира", true, "Да! Голоден — можно добавки. Это нормально."],
    ["Стесняться и молчать", false, "Не надо стесняться: если голоден, скажи об этом."],
    ["Съесть вместо этого конфеты", false, "Конфеты не заменят обед. Лучше добавка с тарелки."]] },
];
let I = 0, right = 0;
function show() {
  const s = SIT[I];
  $("#round").textContent = `${I + 1} из ${SIT.length}`;
  $("#when").textContent = s.when; $("#sit").textContent = s.sit; $("#thought").textContent = s.th; $("#hero").src = S(s.hero);
  $("#next").classList.remove("on");
  const opts = shuffle(s.opts);
  $("#opts").innerHTML = opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="l">${"АБВ"[i]}</span>${o[0]}</button>`).join("");
  $("#opts").querySelectorAll(".opt").forEach((b, i) => b.onclick = () => pick(b, opts[i], opts));
  say("Подумай: что подсказывает живот?", s.who);
}
function pick(b, o, opts) {
  audio(); const s = SIT[I];
  if (o[1]) {
    if (!$("#opts").dataset.miss) right++;
    b.classList.add("ok"); sfx.check(); say(o[2], s.who, "good");
    $("#opts").querySelectorAll(".opt").forEach(x => x.disabled = true);
    $("#next").classList.add("on"); $("#next").textContent = I < SIT.length - 1 ? "Дальше →" : "Итог";
    delete $("#opts").dataset.miss;
  } else {
    $("#opts").dataset.miss = 1;
    b.classList.add("no"); b.disabled = true; sfx.nope(); say(o[2] + " Попробуй другой вариант.", s.who, "bad");
  }
}
$("#next").onclick = () => { audio(); I++; if (I < SIT.length) show(); else finish(); };
function finish() {
  sfx.win(); store.set("tummy", true);
  showWin(`<h2>Живот — хороший подсказчик!</h2><p class="stars">С первого раза: ${right} из ${SIT.length}</p>
    <p>Голоден — можно поесть или попросить добавки. Наелся — можно остановиться. Хочется пить — вода. Сладкое — иногда.</p>
    <button class="btn green" onclick="I=0; right=0; hideWin(); show()">Ещё раз</button> <a class="btn ghost" href="index.html">В меню</a>`);
}
show();
</script>
</body>
</html>
