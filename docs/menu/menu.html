  <p>15 завтраков, 15 обедов, 15 ужинов на 4 человек. <b style="color:var(--veg)">Овощи и фрукты</b> · <b style="color:var(--grain)">Крупы и хлеб</b> · <b style="color:var(--prot)">Белок</b></p>
